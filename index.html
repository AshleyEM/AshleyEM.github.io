<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Comic Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="header_container">
    <div id="nav">
      <a href="https://www.youtube.com/@LowRentWitchcraft">YouTube</a>
      <a href="https://www.artstation.com/ashem">ArtStation</a>
    </div>
    <a id="banner" href="index.html">
      <img src="lrw.png"/>
    </a>
  </div>

  <div id="gallery">


    <div class="card" data-id="resume_gap">
        <img src="comics/resume_gap/preview.png"/>
        <h3>Résumé Gap</h3>
    </div>

    <div class="card" data-id="lucy's_friend">
        <img src="comics/lucy's_friend/preview.png"/>
        <h3>Lucy's Friend</h3>
    </div>

    <div class="card" data-id="traditional_family_values">
        <img src="comics/traditional_family_values/preview.jpg"/>
        <h3>Traditional Family Values</h3>
    </div>

    <div class="card" data-id="perspective">
        <img src="comics/perspective/preview.png"/>
        <h3>Perspective</h3>
    </div>



  </div>    

  <!--Hidden, used for single comic-->
  <div id="reader">

    <div id="pages_container">
      <!--will be populated with comic pages-->
    </div>
  </div>

</body>


<script type="module">

// ==============================
// This reads from a JSON file, which means you can't
// run this by just opening index.html. You need a server.
// Use Live Server extension for VS Code. 
// In VS Code's file explorer, right click index.html > Open with Live Server.
// Github Pages already uses a server. This precaution is just for local development.
// ==============================

var gallery = document.getElementById("gallery");
var reader = document.getElementById("reader");
var pages_container = document.getElementById("pages_container");

// (1)----- Get data from comics.json -----
let comicsData = [];

const response = await fetch('./comics.json');
if (response.ok) {
  comicsData = await response.json();
  console.log('Loaded:', comicsData);
} else {
  console.error('Failed to load data');
}

// (2)----- Attach event listener to each comic card ------
// When a card is clicked, data-id is fed into readComic()
// data-id = 'title' in JSON file
document.addEventListener('click', function (event) {
  const card = event.target.closest('.card');
  if (card && !event.target.classList.contains('prevent-default')) {
    readComic(card.dataset.id); // render comic pages
  }
});

// (3) ----- When card is clicked, render pages of 1 comic ---
function readComic(title){

  // Hide gallery, show reader
  gallery.style.display = 'none';
  reader.style.display = 'block';

  console.log(title);
  // Get comic pages
  const pages = comicsData[title].pages;

  // Render comic pages
  let readerHtml = '';
  for (let i = 0; i < pages.length; i++){
    readerHtml += `
    <div class="page">
      <img src="${pages[i]}"/>
    </div>
    `
  }
  pages_container.innerHTML += readerHtml;
}


</script>
</html>
